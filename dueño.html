<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dueño</title>
<style>
body{background:#000;color:#D4AF37;font-family:Arial;padding:20px}
.card{background:#111;padding:20px;border-radius:15px;margin:10px 0;font-size:20px}
</style>
</head>
<body>

<h1>Ventas</h1>
<div id="ventas"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection,onSnapshot }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const div=document.getElementById("ventas");

onSnapshot(collection(db,"pedidos"),snap=>{
let total=0;
snap.forEach(d=>{
const data=d.data();
if(data.estado==="cobrado"){total+=data.total;}
});
div.innerHTML=`<div class="card">Total vendido: $${total}</div>`;
});
</script>

</body>
</html>

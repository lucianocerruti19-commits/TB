<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cocina</title>
<style>
body{background:#000;color:#D4AF37;font-family:Arial;padding:20px}
.card{background:#111;padding:15px;border-radius:15px;margin:10px 0}
button{background:#D4AF37;color:black;border:none;padding:10px;border-radius:10px}
</style>
</head>
<body>

<h1>Cocina</h1>
<div id="pedidos"></div>

<script type="module">
import { db } from "./firebase.js";
import { collection,onSnapshot,doc,updateDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const cont=document.getElementById("pedidos");

onSnapshot(collection(db,"pedidos"),snap=>{
cont.innerHTML="";
snap.forEach(d=>{
const data=d.data();
if(data.estado==="pendiente"){
cont.innerHTML+=`
<div class="card">
<h2>${data.mesa}</h2>
<p>${data.items.join(", ")}</p>
<button onclick="marcar('${d.id}')">Marcar Listo</button>
</div>`;
}
});
});

window.marcar=async(id)=>{
await updateDoc(doc(db,"pedidos",id),{estado:"listo"});
}
</script>

</body>
</html>
